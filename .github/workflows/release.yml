name: Sürüm Yayınla

# Etiket (tag) push edildiğinde veya elle tetiklendiğinde çalışır.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (örn. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: APK derle ve yayınla
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK bileşenlerini indir
        shell: bash
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gradle ile build et
        uses: gradle/actions/setup-gradle@v4

      - name: Offline haritayı hazırla (TOPO + UYDU)
        shell: bash
        env:
          # gh release download icin gerekli
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p app/src/main/assets/offline

          prepare() {
            local pattern="$1" localfile="$2" builder="$3"
            echo "=== $localfile ==="
            # 1) EN SON surumdeki haritayi kullan (her surumde guncel harita bir sonrakine aktarilir)
            gh release download --pattern "$pattern" \
              --dir app/src/main/assets/offline || true
            # 2) Yoksa onceki etiketten dene
            if [ ! -f "app/src/main/assets/offline/$localfile" ]; then
              PREV=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
              if [ -n "$PREV" ]; then
                echo "Onceki surumden deneniyor: $PREV"
                gh release download "$PREV" --pattern "$pattern" \
                  --dir app/src/main/assets/offline || true
              fi
            fi
            # 3) Hicbiri yoksa sifirdan uret
            if [ ! -f "app/src/main/assets/offline/$localfile" ]; then
              echo "Harita sifirdan uretiliyor: $builder (10-40 dakika surebilir)..."
              python "$builder"
            else
              echo "Harita hazir."
            fi
          }

          prepare "afyon.mbtiles" "afyon.mbtiles" "tools/build_mbtiles.py"
          prepare "afyon_sat.mbtiles" "afyon_sat.mbtiles" "tools/build_satellite.py"

          ls -lh app/src/main/assets/offline/

      - name: Sürüm bilgisini hesapla
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          PATCH=${PATCH:-0}
          CODE=$((MAJOR * 100 + MINOR * 10 + PATCH))
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Sürüm $VERSION (versionCode $CODE)"

      - name: Release imzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets tanimli degil. KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD ayarlanmali."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Keystore hazir."

      - name: APK derle
        shell: bash
        run: |
          set -e
          # gradlew calistirilabilir olmali (git exec biti Windows'ta korunmayabilir)
          chmod +x gradlew
          ./gradlew clean assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"
          # Varlik adini surum iceren anlasilir bir isme cevir
          mv app/build/outputs/apk/release/app-release.apk \
             "AltinAramaHarita-${VERSION_NAME}.apk"
          ls -lh app/build/outputs/apk/release/

      - name: Sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Altın Arama Harita ${{ github.event.inputs.tag || github.ref_name }}

            Otomatik derleme. Bu APK, GitHub Actions tarafından üretilmiştir.

            **Kurulum:** Bu sayfadaki `AltinAramaHarita-<sürüm>.apk` dosyasını indirip telefonda açın.
            İlk kurulumdan sonra, uygulama içindeki **Sürüm Güncelleme** menüsü ile yeni sürümleri
            otomatik olarak alabilirsiniz.

            **Yenilikler:** UYDU görüntüsü katmanı + **CANLI canlı uydu akışı**,
            derin zoom blokları (pin ve kazı noktaları çevresinde z20'ye kadar ~0.15 m/piksel),
            zenginleştirilmiş pin paneli (savak uygunluğu, kazı noktaları, ulaşım, hava durumu),
            Arazide Altın Rehberi.

            `afyon.mbtiles` = topografik harita, `afyon_sat.mbtiles` = uydu görüntüsü paketi (derin bloklarlı).

            ---
            Harita: © OpenStreetMap katılımcıları, OpenTopoMap (CC-BY-SA) · Uydu: Google uydu katmanı (kişisel kullanım)
          files: |
            AltinAramaHarita-*.apk
            app/src/main/assets/offline/afyon.mbtiles
            app/src/main/assets/offline/afyon_sat.mbtiles
          fail_on_unmatched_files: false
